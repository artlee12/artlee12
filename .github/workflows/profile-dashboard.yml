name: Refresh profile dashboard

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-dashboard.yml
      - scripts/profile_dashboard.py
      - scripts/stack-icons.json

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'artlee12/artlee12'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Render public statistics
        run: python3 scripts/profile_dashboard.py
      - name: Publish changed SVGs
        run: |
          git add -- assets/dashboard*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh profile dashboard statistics'
          git push
